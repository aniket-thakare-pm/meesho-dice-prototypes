<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meesho - Livestream View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; background-color: #000; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: -apple-system, sans-serif; overflow: hidden; }
        .mobile-container { width: 100%; height: 100%; position: relative; background: #000; overflow: hidden; }
        
        .chat-mask {
            -webkit-mask-image: linear-gradient(to top, black 70%, transparent 100%);
            mask-image: linear-gradient(to top, black 70%, transparent 100%);
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen m-0 p-4 font-sans">
    <div class="w-full max-w-[380px] h-[750px] bg-black shadow-2xl relative overflow-hidden rounded-[2rem] border-[12px] border-gray-900 flex flex-col mx-auto">
        <!-- Full Screen Video Mockup -->
        <div class="w-full h-full relative cursor-pointer">
            <!-- Livestreamer Image (Makeup/Skincare tutorial) -->
            <img src="https://images.unsplash.com/photo-1599305090598-fe179d501227?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover opacity-90">
            <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/30 to-black/50"></div>
            
            <!-- Top Bar -->
            <div class="absolute top-4 left-4 right-4 z-50 flex justify-between items-start">
                <div class="flex items-center gap-3">
                    <a href="livestream_notification.html" class="w-8 h-8 bg-black/40 rounded-full flex items-center justify-center text-white backdrop-blur-sm cursor-pointer hover:bg-black/60 transition">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <div class="flex items-center gap-2 bg-black/40 rounded-full pr-3 pl-1 py-1 backdrop-blur-sm border border-white/10">
                        <div class="w-7 h-7 rounded-full overflow-hidden border border-white/50">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-4.0.3&w=100&q=80" class="w-full h-full object-cover">
                        </div>
                        <span class="text-white text-xs font-bold tracking-wide">skincare_sneha</span>
                    </div>
                </div>
                
                <div class="flex flex-col items-end gap-2">
                    <div class="bg-red-600 text-white text-[10px] font-black px-2 py-1 rounded-sm animate-pulse tracking-widest uppercase shadow-md flex items-center">
                        <div class="w-1.5 h-1.5 bg-white rounded-full mr-1.5"></div> LIVE
                    </div>
                    <div class="bg-black/50 text-white text-[10px] font-semibold px-2 py-1 rounded-full backdrop-blur-sm flex items-center gap-1 border border-white/10">
                        <i class="fa-solid fa-eye text-[9px]"></i> 1,248
                    </div>
                </div>
            </div>

            <!-- Right Side Action Icons -->
            <div class="absolute bottom-60 right-4 flex flex-col gap-5 items-center z-20">
                <div class="flex flex-col items-center gap-1 text-white cursor-pointer hover:scale-110 transition-transform relative group">
                    <i class="fa-solid fa-heart text-3xl drop-shadow-md text-pink-500"></i>
                    <span class="text-xs font-semibold drop-shadow-md">12.4K</span>
                    <!-- Floating hearts animation mockup -->
                    <i class="fa-solid fa-heart absolute -top-4 text-pink-400 text-sm opacity-0 group-hover:opacity-100 group-hover:-translate-y-4 transition-all duration-500"></i>
                </div>
                <div class="flex flex-col items-center gap-1 text-white cursor-pointer hover:scale-110 transition-transform">
                    <i class="fa-solid fa-share text-3xl drop-shadow-md"></i>
                    <span class="text-xs font-semibold drop-shadow-md">Share</span>
                </div>
            </div>

            <!-- Live Chat Area -->
            <div class="absolute bottom-32 left-4 right-16 h-36 chat-mask overflow-hidden z-20 flex flex-col justify-end gap-2 pb-2">
                <div class="text-[11px] text-white/90 drop-shadow-md leading-tight"><span class="font-bold text-pink-300">Riya Singh:</span> Is this suitable for oily skin?</div>
                <div class="text-[11px] text-white/90 drop-shadow-md leading-tight"><span class="font-bold text-yellow-300">Pooja Sharma:</span> Just ordered it!! 😍</div>
                <div class="text-[11px] text-white/90 drop-shadow-md leading-tight"><span class="font-bold text-blue-300">Ananya:</span> The glow is real wow ✨</div>
                <div class="text-[11px] text-white/90 drop-shadow-md leading-tight"><span class="font-bold text-green-300">Sneha_Fan12:</span> Please drop a discount code!</div>
                <div class="text-[11px] text-white/90 drop-shadow-md leading-tight"><span class="font-bold text-purple-300">Kavya:</span> omg adding to cart right now 🛒</div>
            </div>

            <!-- Two Rectangular Product Boxes (Shoppable Livestream feature) -->
            <div class="absolute bottom-4 left-4 right-4 z-30 flex gap-3 overflow-x-auto pb-2 no-scrollbar">
                
                <!-- Product 1 (Clickable to Simple PDP) -->
                <a href="simple_pdp.html" class="min-w-[180px] flex items-center gap-2 bg-white/20 backdrop-blur-xl rounded-xl p-2 border border-white/40 shadow-xl cursor-pointer hover:bg-white/30 transition-all group">
                    <img src="https://images.unsplash.com/photo-1620916566398-39f1143ab7be?ixlib=rb-4.0.3&w=100&q=80" class="w-12 h-12 rounded-lg object-cover border border-white/50">
                    <div class="flex flex-col justify-center flex-1">
                        <div class="bg-red-500 text-white text-[8px] font-bold px-1.5 py-0.5 rounded-sm w-max mb-0.5 animate-bounce">LIVE DROP</div>
                        <span class="text-white text-[11px] font-bold leading-tight truncate">Hydrating Face Cream</span>
                        <div class="flex items-center gap-1 mt-0.5">
                            <span class="text-white text-[12px] font-black">₹345</span>
                            <span class="text-white/60 text-[10px] line-through">₹599</span>
                        </div>
                    </div>
                </a>

                <!-- Product 2 -->
                <div class="min-w-[180px] flex items-center gap-2 bg-white/20 backdrop-blur-xl rounded-xl p-2 border border-white/40 shadow-xl cursor-pointer hover:bg-white/30 transition-all group">
                    <img src="https://images.unsplash.com/photo-1596462502278-27bf85033878?ixlib=rb-4.0.3&w=100&q=80" class="w-12 h-12 rounded-lg object-cover border border-white/50">
                    <div class="flex flex-col justify-center flex-1">
                        <span class="text-white text-[11px] font-bold leading-tight truncate mt-1">Vitamin C Serum</span>
                        <div class="flex items-center gap-1 mt-0.5">
                            <span class="text-white text-[12px] font-black">₹499</span>
                            <span class="text-white/60 text-[10px] line-through">₹899</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
