<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livestream Notification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; background-color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: -apple-system, sans-serif; overflow: hidden; }
        .mobile-container { width: 100%; height: 100%; position: relative; background: white; overflow: hidden; }
        .bg-img { width: 100%; height: 100%; object-fit: contain; }
        
        /* Notification styling */
        .push-notification {
            position: absolute; top: 30px; left: 4%; width: 92%;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            border-radius: 16px; padding: 12px 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex; align-items: flex-start; gap: 12px;
            cursor: pointer; z-index: 50;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen m-0 p-4 font-sans">
    <div class="w-full max-w-[380px] h-[750px] bg-black shadow-2xl relative overflow-hidden rounded-[2rem] border-[12px] border-gray-900 flex flex-col mx-auto">
        <img src="../home_bg.jpg" class="bg-img" alt="Meesho Home">
        
        <a href="livestream_view.html" class="push-notification hover:bg-gray-50 transition-colors">
            <div class="w-10 h-10 rounded-lg overflow-hidden flex-shrink-0 mt-1 border border-gray-200">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-4.0.3&w=100&q=80" class="w-full h-full object-cover">
            </div>
            <div class="flex-1">
                <div class="flex justify-between items-center mb-0.5">
                    <span class="text-[11px] text-gray-500 font-semibold tracking-wide uppercase flex items-center">
                        <span class="w-4 h-4 bg-purple-600 rounded-sm text-white flex items-center justify-center mr-1 text-[8px]">M</span>
                        Meesho
                    </span>
                    <span class="text-[10px] text-gray-400">now</span>
                </div>
                <h4 class="text-[13px] font-bold text-gray-900 leading-tight mb-1">skincare_sneha is LIVE! <span class="text-red-500 animate-pulse">🔴</span></h4>
                <p class="text-[12px] text-gray-600 leading-snug">She's sharing her glowing skin routine and dropping exclusive live discounts. Tap to watch!</p>
            </div>
        </a>
    </div>
</body>
</html>
