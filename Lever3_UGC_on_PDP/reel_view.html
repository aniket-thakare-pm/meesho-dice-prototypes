<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meesho - Creator Reel View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        'meesho-purple': '#8b1874', 
                        'meesho-pink': '#df1e7b',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen m-0 p-4 font-sans">

    <!-- Mobile Wrapper -->
    <div class="w-full  h-full w-full bg-black  relative overflow-hidden    flex flex-col">
        
        <!-- Back Button Header -->
        <div class="absolute top-0 left-0 w-full p-4 z-50 flex justify-between items-center bg-gradient-to-b from-black/60 to-transparent">
            <a href="creator_profile.html" class="text-white drop-shadow-md text-xl cursor-pointer">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <i class="fa-solid fa-camera text-white drop-shadow-md text-xl"></i>
        </div>

        <!-- Full Screen Video Mockup (Whitish product / Cream) -->
        <div class="w-full h-full relative cursor-pointer group">
            <img src="https://images.unsplash.com/photo-1599305090598-fe179d501227?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover opacity-95">
            <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
            
            <!-- Central Play Button (subtle mockup) -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity">
                <div class="w-16 h-16 bg-black/40 rounded-full flex items-center justify-center backdrop-blur-sm border border-white/20">
                    <i class="fa-solid fa-play text-white text-2xl pl-1"></i>
                </div>
            </div>
        </div>

        <!-- Right Side Action Icons -->
        <div class="absolute bottom-24 right-4 flex flex-col gap-6 items-center z-20">
            <div class="flex flex-col items-center gap-1 text-white cursor-pointer hover:scale-110 transition-transform">
                <i class="fa-solid fa-heart text-3xl drop-shadow-md"></i>
                <span class="text-xs font-semibold drop-shadow-md">1,824</span>
            </div>
            <div class="flex flex-col items-center gap-1 text-white cursor-pointer hover:scale-110 transition-transform">
                <i class="fa-solid fa-comment text-3xl drop-shadow-md"></i>
                <span class="text-xs font-semibold drop-shadow-md">48</span>
            </div>
            <div class="flex flex-col items-center gap-1 text-white cursor-pointer hover:scale-110 transition-transform">
                <i class="fa-solid fa-share text-3xl drop-shadow-md"></i>
                <span class="text-xs font-semibold drop-shadow-md">Share</span>
            </div>
            <div class="flex flex-col items-center gap-1 text-white cursor-pointer hover:scale-110 transition-transform mt-2">
                <i class="fa-solid fa-ellipsis-vertical text-2xl drop-shadow-md"></i>
            </div>
        </div>

        <!-- Bottom Left Info Area -->
        <div class="absolute bottom-6 left-4 right-20 z-20 flex flex-col gap-3">
            
            <!-- Affiliated Product Card Thumbnail -->
            <!-- Clicking this redirects to the simple PDP for this product -->
            <a href="simple_pdp.html" class="flex items-center gap-3 bg-white/20 backdrop-blur-md  p-1.5 w-max border border-white/40 cursor-pointer shadow-lg hover:bg-white/30 transition-all group">
                <img src="https://images.unsplash.com/photo-1620916566398-39f1143ab7be?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80" class="w-12 h-12 rounded-lg object-cover border border-white/50">
                <div class="flex flex-col pr-3">
                    <span class="text-white text-[11px] font-bold leading-tight drop-shadow-sm">Hydrating Face Cream</span>
                    <span class="text-white/90 text-[10px] font-medium mt-0.5 flex items-center gap-1">
                        ₹245 <i class="fa-solid fa-chevron-right text-[8px] opacity-70 group-hover:translate-x-0.5 transition-transform"></i>
                    </span>
                </div>
            </a>

            <!-- Creator Username & Follow Button -->
            <div class="flex items-center gap-2 mt-1">
                <div class="w-8 h-8 rounded-full overflow-hidden border border-white/80 shadow-md">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-4.0.3&w=100&q=80" class="w-full h-full object-cover">
                </div>
                <span class="text-white font-bold text-[15px] drop-shadow-md tracking-tight">skincare_sneha</span>
                <button class="bg-transparent border border-white text-white text-[11px] font-bold px-3 py-1 rounded-full ml-1 hover:bg-white hover:text-black transition-colors shadow-sm">
                    Follow
                </button>
            </div>

            <!-- Video Caption -->
            <p class="text-white text-sm drop-shadow-md leading-snug w-[90%]">
                This face cream is pure magic for dry skin! It literally melts into my face ✨ Shop the exact product above! 👇 #skincare #meesho
            </p>
        </div>
    </div>
</body>
</html>
