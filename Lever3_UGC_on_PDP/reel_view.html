<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meesho - Creator Reel View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        'meesho-purple': '#8b1874', 
                        'meesho-pink': '#df1e7b',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        .reel-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

    </style>
</head>
<body class="bg-black m-0 p-0 h-screen w-full overflow-hidden">

    <div class="reel-container" id="reelContainer">
        
        <!-- 1. FULL-SCREEN 9:16 VERTICAL REEL VIDEO IMAGE (ZOOMED & CENTERED) -->
        <div class="absolute inset-0 w-full h-full overflow-hidden bg-black cursor-pointer" onclick="togglePlayPause()">
            <img src="https://images.unsplash.com/photo-1599305090598-fe179d501227?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=85" 
                 alt="Hydrating Face Cream Video" 
                 class="w-full h-full object-cover object-center scale-[1.02]">
            
            <!-- Top Vignette Gradient for header & icons -->
            <div class="absolute top-0 left-0 right-0 h-36 bg-gradient-to-b from-black/80 via-black/35 to-transparent pointer-events-none"></div>

            <!-- Bottom Vignette Gradient for caption & buttons -->
            <div class="absolute bottom-0 left-0 right-0 h-84 bg-gradient-to-t from-black/95 via-black/60 to-transparent pointer-events-none"></div>

            <!-- Pause / Play Flash Indicator -->
            <div id="playIndicator" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-200">
                <div class="w-16 h-16 rounded-full bg-black/60 backdrop-blur-md flex items-center justify-center border border-white/20 text-white text-2xl shadow-xl">
                    <i class="fa-solid fa-play ml-1"></i>
                </div>
            </div>
        </div>

        <!-- 2. TOP HEADER (Reels Navigation Bar) -->
        <div class="relative z-30 flex items-center justify-between px-4 pt-7 pb-2 shrink-0 pointer-events-auto">
            <a href="creator_profile.html" class="w-9 h-9 -ml-1 flex items-center justify-center text-white text-xl drop-shadow-md hover:opacity-80 transition cursor-pointer" title="Back">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <span class="text-white font-extrabold text-base tracking-wide drop-shadow-md">Reels</span>
            <button class="w-9 h-9 -mr-1 flex items-center justify-center text-white text-xl drop-shadow-md hover:opacity-80 transition cursor-pointer" title="Camera">
                <i class="fa-solid fa-camera"></i>
            </button>
        </div>

        <!-- Spacer for center video area -->
        <div class="flex-1"></div>

        <!-- 3. RIGHT SIDE ACTION ICONS (Instagram Reel Layout) -->
        <div class="absolute bottom-6 right-3.5 z-30 flex flex-col items-center gap-4.5 pointer-events-auto">
            <!-- Like -->
            <div class="flex flex-col items-center gap-1 cursor-pointer group" onclick="toggleLike()">
                <div class="w-10 h-10 flex items-center justify-center text-white text-2xl drop-shadow-lg transition-transform active:scale-125">
                    <i class="fa-solid fa-heart transition-colors duration-200" id="likeIcon" style="color: #ffffff;"></i>
                </div>
                <span class="text-white text-[11px] font-semibold drop-shadow-md tracking-tight" id="likeCount">1,824</span>
            </div>

            <!-- Comment -->
            <div class="flex flex-col items-center gap-1 cursor-pointer group">
                <div class="w-10 h-10 flex items-center justify-center text-white text-2xl drop-shadow-lg transition-transform group-hover:scale-110">
                    <i class="fa-solid fa-comment"></i>
                </div>
                <span class="text-white text-[11px] font-semibold drop-shadow-md tracking-tight">48</span>
            </div>

            <!-- Share -->
            <div class="flex flex-col items-center gap-1 cursor-pointer group">
                <div class="w-10 h-10 flex items-center justify-center text-white text-2xl drop-shadow-lg transition-transform group-hover:scale-110">
                    <i class="fa-solid fa-paper-plane"></i>
                </div>
                <span class="text-white text-[11px] font-semibold drop-shadow-md tracking-tight">Share</span>
            </div>

            <!-- More (Ellipsis) -->
            <div class="w-10 h-8 flex items-center justify-center text-white text-xl drop-shadow-lg cursor-pointer hover:opacity-80">
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </div>

            <!-- Spinning Vinyl Audio Track -->
            <div class="w-9 h-9 rounded-lg border-2 border-white/80 overflow-hidden shadow-lg mt-0.5 cursor-pointer relative bg-zinc-900 flex items-center justify-center">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-4.0.3&w=100&q=80" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-black/20 flex items-center justify-center">
                    <i class="fa-solid fa-music text-[9px] text-white"></i>
                </div>
            </div>
        </div>

        <!-- 4. BOTTOM LEFT CONTENT OVERLAY -->
        <div class="relative z-30 px-3.5 pb-5 pr-16 flex flex-col gap-2.5 pointer-events-auto">
            
            <!-- Shoppable Product Sticker (Click opens simple_pdp.html) -->
            <a href="simple_pdp.html" class="inline-flex items-center gap-2.5 bg-black/60 backdrop-blur-md px-2.5 py-1.5 rounded-xl border border-white/30 text-white shadow-xl hover:bg-black/80 hover:border-white/50 transition-all max-w-[260px] group cursor-pointer">
                <div class="w-9 h-9 rounded-lg overflow-hidden bg-white shrink-0 border border-white/40">
                    <img src="https://images.unsplash.com/photo-1620916566398-39f1143ab7be?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80" alt="Product" class="w-full h-full object-cover">
                </div>
                <div class="flex flex-col min-w-0 pr-1">
                    <div class="flex items-center gap-1 text-[11px] font-bold text-white leading-tight truncate">
                        <i class="fa-solid fa-bag-shopping text-pink-400 text-[10px]"></i>
                        <span class="truncate">Hydrating Face Cream</span>
                    </div>
                    <div class="text-[10px] font-medium text-emerald-400 flex items-center gap-1.5 mt-0.5">
                        <span class="font-bold text-white">₹245</span>
                        <span class="text-white/60 text-[9px] line-through">₹350</span>
                        <span class="text-[9px] bg-emerald-500/30 text-emerald-300 px-1 py-0.2 rounded font-semibold">30% off</span>
                        <i class="fa-solid fa-chevron-right text-[8px] text-white/70 ml-auto group-hover:translate-x-0.5 transition-transform"></i>
                    </div>
                </div>
            </a>

            <!-- Creator Handle & Follow -->
            <div class="flex items-center gap-2 mt-0.5">
                <a href="creator_profile.html" class="w-8 h-8 rounded-full border border-white/80 overflow-hidden shadow-md shrink-0 cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-4.0.3&w=100&q=80" class="w-full h-full object-cover" alt="skincare_sneha">
                </a>
                <a href="creator_profile.html" class="text-white font-bold text-sm drop-shadow-md tracking-tight cursor-pointer hover:underline flex items-center gap-1">
                    skincare_sneha <i class="fa-solid fa-circle-check text-blue-400 text-[11px]"></i>
                </a>
                <button onclick="toggleFollow(this)" id="followBtn" class="bg-transparent border border-white text-white text-[11px] font-bold px-3 py-0.5 rounded-full hover:bg-white hover:text-black transition-colors shadow-sm ml-1">
                    Follow
                </button>
            </div>

            <!-- Video Caption -->
            <p class="text-white text-xs drop-shadow-md leading-relaxed pr-2">
                This face cream is pure magic for dry skin! It literally melts into my face ✨ Shop the exact product above! 👇 <span class="font-semibold text-white/90">#skincare #meesho</span>
            </p>

            <!-- Audio Track Line -->
            <div class="flex items-center gap-2 text-white/90 text-[11px] drop-shadow">
                <i class="fa-solid fa-music text-[9px]"></i>
                <span class="tracking-tight truncate">Original audio • skincare_sneha</span>
            </div>
        </div>

        <!-- 5. PROGRESS BAR (AT THE VERY BOTTOM) -->
        <div class="absolute bottom-0 left-0 right-0 h-[2.5px] bg-white/25 z-40">
            <div class="h-full bg-white w-2/5"></div>
        </div>
    </div>

    <script>
        let isLiked = false;
        function toggleLike() {
            isLiked = !isLiked;
            const icon = document.getElementById('likeIcon');
            const count = document.getElementById('likeCount');
            if (isLiked) {
                icon.style.color = '#ef4444';
                count.textContent = '1,825';
            } else {
                icon.style.color = '#ffffff';
                count.textContent = '1,824';
            }
        }

        let isFollowing = false;
        function toggleFollow(btn) {
            isFollowing = !isFollowing;
            if (isFollowing) {
                btn.textContent = 'Following';
                btn.className = 'bg-white text-black text-[11px] font-bold px-3 py-0.5 rounded-full transition-colors shadow-sm ml-1';
            } else {
                btn.textContent = 'Follow';
                btn.className = 'bg-transparent border border-white text-white text-[11px] font-bold px-3 py-0.5 rounded-full hover:bg-white hover:text-black transition-colors shadow-sm ml-1';
            }
        }

        function togglePlayPause() {
            const ind = document.getElementById('playIndicator');
            ind.style.opacity = '1';
            setTimeout(() => {
                ind.style.opacity = '0';
            }, 500);
        }
    </script>
</body>
</html>
