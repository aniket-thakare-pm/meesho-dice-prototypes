<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meesho - Lever 5 Gamification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            margin: 0; background-color: #111827; display: flex; 
            align-items: center; justify-content: center; gap: 80px; min-height: 100vh; 
            font-family: -apple-system, sans-serif; padding: 40px;
        }
        
        .prototype-wrapper {
            display: flex; flex-direction: column; align-items: center;
        }

        .phone-frame {
            box-sizing: content-box; width: 390px; aspect-ratio: 472 / 1024;
            border: 14px solid #000; border-radius: 40px;
            position: relative; background: #fff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            overflow: hidden; 
        }

        .phone-frame::before {
            content: ''; position: absolute; top: 15px; left: 50%;
            transform: translateX(-50%); width: 12px; height: 12px;
            background: #000; border-radius: 50%; z-index: 100;
        }

        iframe {
            width: 100%; height: 100%; border: none;
        }
    </style>
</head>
<body>

    <!-- ================= PROTOTYPE: CREATOR ANALYTICS DASHBOARD ================= -->
    <div class="prototype-wrapper">
        <h2 class="text-white text-2xl font-black mb-6 tracking-wide drop-shadow-md">Analytics and Milestones</h2>
        <div class="phone-frame">
            <iframe src="creator_analytics_dashboard.html"></iframe>
        </div>
    </div>

</body>
</html>
